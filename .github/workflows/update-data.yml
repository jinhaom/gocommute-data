name: update-data

# 每天檢查一次運輸署的「資料截止日」（95 字節）：
#   日期沒變 → 立刻結束（約 1 分鐘）
#   日期變了 → 重跑整條管道 → 發佈新版本 Release + 更新 version.json
on:
  schedule:
    - cron: '17 3 * * *'        # 每天 03:17 UTC（香港 11:17）
  workflow_dispatch:
    inputs:
      force:
        description: '強制重建（忽略版本比對）'
        type: boolean
        default: false

# 公開倉庫 → 標準 runner 分鐘數不限；這裡只寫 GITHUB_TOKEN 需要的權限
permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 檢查官方資料日期
        id: check
        run: |
          set -euo pipefail
          curl -fsS --retry 3 https://static.data.gov.hk/td/pt-headway-tc/DATA_LAST_UPDATED_DATE.csv -o /tmp/date.csv
          DATE="$(tr -d '\r' < /tmp/date.csv | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)"
          CUR="$(python3 -c "import json;print(json.load(open('version.json'))['data_date'])" 2>/dev/null || echo none)"
          echo "官方日期=$DATE  已發佈=$CUR"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          if [ "$DATE" = "$CUR" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 無更新 → 結束
        if: steps.check.outputs.changed == 'false'
        run: echo "官方資料仍是 ${{ steps.check.outputs.date }}，不下載、不重建。" >> "$GITHUB_STEP_SUMMARY"

      - name: 跑資料管道
        if: steps.check.outputs.changed == 'true'
        run: bash pipeline/run_pipeline.sh work

      - name: 打包 + 產生 version.json
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          DATE="$(cat work/DATA_DATE)"
          # 先打包，再把 zip 的 sha256/大小一起寫進 version.json（讓 app 解壓前就能校驗）
          ( cd work/assets && zip -q -9 -r "../transit-data-$DATE.zip" . )
          python3 - "$DATE" <<'PY'
          import hashlib, json, os, sys, datetime
          date = sys.argv[1]
          assets, work = "work/assets", "work"
          names = ["transit_static.json", "transit_fares.jsonl", "transit_headway.json",
                   "transit_mtr_fares.tsv", "operator_stop_map.json", "manifest.json"]
          files = []
          for n in names:
              p = os.path.join(assets, n)
              if not os.path.exists(p):
                  sys.exit(f"✗ 資產缺少 {n}")
              b = open(p, "rb").read()
              files.append({"name": n, "bytes": len(b), "sha256": hashlib.sha256(b).hexdigest()})
          zname = f"transit-data-{date}.zip"
          zpath = os.path.join(work, zname)
          zb = open(zpath, "rb").read()
          tag = f"data-{date}"
          v = {
              "schema": 1,
              "data_date": date,
              "built_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "built_by": "gocommute-data pipeline (GitHub Actions)",
              "zip": {
                  "name": zname,
                  "bytes": len(zb),
                  "sha256": hashlib.sha256(zb).hexdigest(),
                  "url": f"https://github.com/jinhaom/gocommute-data/releases/download/{tag}/{zname}",
              },
              "manifest_sha256": next(f["sha256"] for f in files if f["name"] == "manifest.json"),
              "files": files,
          }
          json.dump(v, open("version.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(f"version.json: zip {len(zb)} B, {len(files)} 個檔案")
          PY

      - name: 發佈 Release（不可變、可回滾）
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE="$(cat work/DATA_DATE)"
          TAG="data-$DATE"
          ZIP="work/transit-data-$DATE.zip"
          URL="https://github.com/jinhaom/gocommute-data/releases/download/$TAG/$(basename "$ZIP")"

          # 建 Release：GitHub API 偶發 500（實測遇過），必須重試；
          # 千萬不要用 `|| gh release upload` 兜底 —— 那會留下一個草稿、而步驟仍報 success，
          # 手機端永遠拿不到資料（且看起來一切正常）。
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG 已存在"; break; fi
            if gh release create "$TAG" --draft --title "資料 $DATE" \
                 --notes "運輸署資料截止日 $DATE（自動建置：github.com/jinhaom/gocommute/actions）"; then
              echo "已建立 Release $TAG"; break
            fi
            echo "建立 Release 失敗（第 $i 次），20 秒後重試…"; sleep 20
          done
          gh release view "$TAG" >/dev/null 2>&1 || { echo "✗ 無法建立 Release $TAG"; exit 1; }

          # 資產冪等上傳（同日重跑會覆蓋）
          gh release upload "$TAG" "$ZIP" version.json --clobber

          # 明確轉正 —— 草稿對未認證訪問不可見，等於手機拿不到
          gh release edit "$TAG" --draft=false
          DRAFT="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
          [ "$DRAFT" = "false" ] || { echo "✗ Release 仍是草稿（isDraft=$DRAFT）"; exit 1; }

          # 用「未認證」請求斷言手機真的下載得到（curl 不會讀 GH_TOKEN）
          code="000"
          for i in $(seq 1 12); do
            code="$(curl -sSL -o /dev/null -w '%{http_code}' "$URL" || true)"
            [ "$code" = "200" ] && break
            echo "尚不可下載（HTTP $code），等 15 秒…"; sleep 15
          done
          [ "$code" = "200" ] || { echo "✗ 未認證下載失敗（HTTP $code）：$URL"; exit 1; }
          echo "✓ 未認證下載 OK：$URL"

      - name: 把 version.json 提交回 main（供 app 便宜輪詢）
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "gocommute-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --staged --quiet && echo "version.json 無變化" || git commit -m "data: 資料更新至 $(cat work/DATA_DATE)"
          git push

      - name: 摘要
        if: steps.check.outputs.changed == 'true'
        run: |
          {
            echo "### 已發佈資料 $(cat work/DATA_DATE)"
            echo '```'
            python3 -c "import json;v=json.load(open('version.json'));print(json.dumps(v,ensure_ascii=False,indent=1))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
